<h2>Your Cart</h2>

<p *ngIf="getItems().length === 0">Your cart is empty.</p>

<ul>
  <li *ngFor="let item of getItems(); let i = index">
    {{ i + 1 }}. {{ item }}
  </li>
</ul>

<div *ngIf="getItems().length > 0">
  <p><strong>Total Items:</strong> {{ getItems().length }}</p>
  <button (click)="clearCart()">Clear Cart</button>
</div>
